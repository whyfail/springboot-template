# Local profile: connects to the Compose stack by default. A local database password default is
# acceptable for developer machines; production profiles never carry default credentials.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app-local-dev-password}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

app:
  security:
    swagger-ui-enabled: true
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
