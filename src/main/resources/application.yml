spring:
  application:
    name: {{ name }}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
      pool-name: app-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:}
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  tracing:
    enabled: ${TRACING_ENABLED:false}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO

app:
  security:
    session-ttl: 8h
    remembered-session-ttl: 30d
    max-sessions-per-user: 5
    bcrypt-strength: 12
    login-attempts-per-minute: 5
    login-attempts-per-hour: 20
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    problem-type-base-url: https://docs.example.com/problems
    swagger-ui-enabled: false
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
