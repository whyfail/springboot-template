name: ci

# The repository is a TEMPLATE source: sources contain {{ package }}/{{ name }}
# placeholders and are not directly compilable. CI generates a project first,
# then runs the full quality gate against the generated output.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Generate, test, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate a project from the template
        run: |
          ./scripts/generate.sh \
            -n springboot-template \
            -p com.example.app \
            -d ./generated

      - name: Full verify on the generated project (unit + Testcontainers + coverage + ArchUnit)
        working-directory: generated
        run: ./mvnw -B -ntp clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: generated/target/site/jacoco
          if-no-files-found: ignore

  image:
    name: OCI image and SBOM
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate a project from the template
        run: |
          ./scripts/generate.sh \
            -n springboot-template \
            -p com.example.app \
            -d ./generated

      - name: Build OCI image (multi-stage, cached Maven repo)
        working-directory: generated
        run: docker build -t springboot-template:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: springboot-template:${{ github.sha }}
          format: spdx-json
          artifact-name: springboot-template-sbom.spdx.json

      # 依赖与镜像漏洞扫描阈值由团队策略确定后接入（如 trivy/grype）。
