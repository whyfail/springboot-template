name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build, test, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless format check
        run: ./mvnw -B -ntp spotless:check

      - name: Full verify (unit + Testcontainers integration + coverage + ArchUnit)
        run: ./mvnw -B -ntp clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  image:
    name: OCI image and SBOM
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build OCI image (multi-stage, cached Maven repo)
        run: docker build -t cwa-backend:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: cwa-backend:${{ github.sha }}
          format: spdx-json
          artifact-name: cwa-backend-sbom.spdx.json

      # 依赖与镜像漏洞扫描阈值由团队策略确定后接入（如 trivy/grype）。
